[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chthm"
version = "2.0.0"
description = "Portable TOML palette switching for Linux desktops"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chthm = "chthm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
